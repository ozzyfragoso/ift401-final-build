
{% extends "base.html" %}

{% block title %}Edit Stock{% endblock %}

{% block content %}
<h2>Edit Stock</h2>

<form method="POST">
    <div class="mb-3">
        <label for="symbol" class="form-label">Stock Symbol</label>
        <input type="text" class="form-control"
               id="symbol" name="symbol"
               value="{{ stock.symbol }}" readonly>
    </div>

<div class="mb-3">
    <label for="company_name" class="form-label">Company Name</label>
    <input type="text" class="form-control"
           id="company_name" name="company_name"
           value="{{ stock.company_name }}"
           maxlength="100" required>
</div>


<div class="mb-3">
    <label for="current_price" class="form-label">Stock Price ($)</label>
    <input type="number" class="form-control"
           id="current_price" name="current_price"
           value="{{ stock.current_price }}"
           min="0.01" step="0.01" required>
</div>

<div class="mb-3">
    <label for="available_quantity" class="form-label">
        Available Shares
    </label>
    <input type="number" class="form-control"
           id="available_quantity"
           name="available_quantity"
           value="{{ stock.available_quantity }}"
           min="0" step="1" required>
</div>

<div class="mb-3">
    <label for="status" class="form-label">Stock Status</label>
    <select class="form-select" id="status" name="status" required>
        <option value="active"
            {% if stock.status == 'active' %}selected{% endif %}>
            Active
        </option>
        <option value="inactive"
            {% if stock.status == 'inactive' %}selected{% endif %}>
            Inactive
        </option>
    </select>
</div>

<div class="mt-3">
    <button type="submit" class="btn btn-primary">
        Update Stock
    </button>
    <a href="{{ url_for('admin_dashboard') }}"
       class="btn btn-secondary">
        Cancel
    </a>
</div>

</form>


{% endblock %}
