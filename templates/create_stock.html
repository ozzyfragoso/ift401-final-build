
{% extends "base.html" %}

{% block title %}Create Stock{% endblock %}

{% block content %}
<h2>Create Stock</h2>

<form method="POST" action="{{ url_for('create_stock') }}">

    <div class="mb-3">
        <label for="symbol" class="form-label">Ticker</label>
        <input type="text" class="form-control"
               id="symbol" name="symbol" maxlength="10"
               value="{{ (form_values or {}).get('symbol', '') }}"
               required>
    </div>

    <div class="mb-3">
        <label for="company_name" class="form-label">Company name</label>
        <input type="text" class="form-control"
               id="company_name" name="company_name" maxlength="100"
               value="{{ (form_values or {}).get('company_name', '') }}"
               required>
    </div>

    <div class="mb-3">
        <label for="available_quantity" class="form-label">
            Shares outstanding
        </label>
        <input type="number" class="form-control"
               id="available_quantity" name="available_quantity"
               min="1" step="1"
               value="{{ (form_values or {}).get('available_quantity', '') }}"
               required>
    </div>

    <div class="mb-3">
        <label for="current_price" class="form-label">
            Initial price
        </label>
        <input type="number" class="form-control"
               id="current_price" name="current_price"
               min="0.01" step="0.01"
               value="{{ (form_values or {}).get('current_price', '') }}"
               required>
    </div>

    <button type="submit" class="btn btn-primary">
        Review stock
    </button>

    <a href="{{ url_for('admin_dashboard') }}"
       class="btn btn-secondary">
        Back to Dashboard
    </a>
</form>
{% endblock %}
